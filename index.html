<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />

  <link rel="icon" href="icon.svg" type="image/svg+xml" />

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="PageDock home">
      <img src="icon.svg" alt="" width="28" height="28" />
      <span>PageDock</span>

    <span class="local-badge" title="Your files are processed in this browser and are not uploaded.">
      <span class="dot" aria-hidden="true"></span> On-device

  <main id="main" tabindex="-1"></main>

    <p>Your PDFs. Your device. Your control. Files are processed in your browser and never uploaded.</p>

  <div id="live" class="sr-only" aria-live="polite"></div>
